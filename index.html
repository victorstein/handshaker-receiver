<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>HandShaker Receiver</title>
<style>
  :root {
    --bg: #0e1013; --panel: #171a1f; --line: #262b33;
    --txt: #e6e9ee; --muted: #8b94a3; --accent: #ff8a3d; --ok: #46d17a; --err: #ff5d5d;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--txt);
    font: 16px/1.5 -apple-system, system-ui, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 480px; margin: 0 auto; padding: 24px 16px 48px;
    min-height: 100dvh; display: flex; flex-direction: column; gap: 20px; }
  h1 { font-size: 20px; margin: 8px 0 0; }
  p.sub { color: var(--muted); margin: 0; font-size: 14px; }
  button {
    appearance: none; border: 0; border-radius: 14px; padding: 18px;
    font-size: 18px; font-weight: 600; color: #141414; background: var(--accent);
    width: 100%; cursor: pointer; transition: opacity .15s; touch-action: manipulation;
  }
  button:disabled { opacity: .4; cursor: default; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px; }
  .status { font-weight: 600; }
  .bar { height: 10px; border-radius: 6px; background: var(--line); overflow: hidden; margin-top: 12px; display: none; }
  .bar > div { height: 100%; width: 0; background: var(--accent); transition: width .15s; }
  .meta { color: var(--muted); font-size: 14px; margin-top: 10px; min-height: 1.4em; }
  .log { font: 12px/1.5 ui-monospace, Menlo, monospace; color: var(--muted);
    white-space: pre-wrap; word-break: break-word; margin-top: 16px; max-height: 40vh; overflow: auto; }
  .ok { color: var(--ok); } .err { color: var(--err); }
  a.saved { color: var(--accent); }
</style>
</head>
<body>
<main>
  <div>
    <h1>HandShaker Receiver</h1>
    <p class="sub">Receive a capture pushed from the Flipper over Bluetooth. Open <b>Send over BLE</b> on the Flipper, then tap below.</p>
  </div>

  <button id="go">Receive capture</button>

  <div class="card">
    <div class="status" id="status">Idle</div>
    <div class="bar" id="bar"><div id="fill"></div></div>
    <div class="meta" id="meta"></div>
  </div>

  <div class="log" id="log"></div>
</main>

<script src="receiver-core.js"></script>
<script>
  const SERIAL_SVC = "8fe5b3d5-2e7f-4a98-2a48-7acc60fe0000";
  const TX_CHAR = "19ed82ae-ed21-4c9d-4145-228e61fe0000"; // Flipper -> us (indicate)
  const RX_CHAR = "19ed82ae-ed21-4c9d-4145-228e62fe0000"; // us -> Flipper (write)

  const $ = (id) => document.getElementById(id);
  const btn = $("go"), statusEl = $("status"), bar = $("bar"), fill = $("fill"), meta = $("meta"), logEl = $("log");

  function log(msg, cls) {
    const line = document.createElement("div");
    if (cls) line.className = cls;
    line.textContent = new Date().toLocaleTimeString() + "  " + msg;
    logEl.prepend(line);
  }
  function setStatus(msg, cls) { statusEl.textContent = msg; statusEl.className = "status" + (cls ? " " + cls : ""); }
  function basename(name) { return (name || "capture.pcap").split("/").pop().split("\\").pop().replace(/[^\w.\-]/g, "_"); }

  function download(name, bytes) {
    const blob = new Blob([bytes], { type: "application/octet-stream" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = basename(name);
    document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 2000);
  }

  async function receive() {
    if (!navigator.bluetooth) {
      setStatus("Web Bluetooth not available", "err");
      log("This browser has no Web Bluetooth. Use Chrome on Android.", "err");
      return;
    }
    btn.disabled = true;
    bar.style.display = "none"; fill.style.width = "0"; meta.textContent = "";
    let device;
    try {
      setStatus("Choose your Flipper…");
      device = await navigator.bluetooth.requestDevice({
        filters: [{ namePrefix: "Flipper" }],
        optionalServices: [SERIAL_SVC],
      });
    } catch (e) {
      setStatus("Idle"); btn.disabled = false;
      log("Device selection cancelled.", "err");
      return;
    }

    const cleanup = () => { btn.disabled = false; };
    device.addEventListener("gattserverdisconnected", () => log("Flipper disconnected."));

    try {
      setStatus("Connecting… (approve pairing if asked)");
      log("Connecting to " + (device.name || device.id));
      const server = await device.gatt.connect();
      const svc = await server.getPrimaryService(SERIAL_SVC);
      const tx = await svc.getCharacteristic(TX_CHAR);
      const rx = await svc.getCharacteristic(RX_CHAR);

      let finished = false;
      const parser = createHshkParser({
        onProgress: (got, size, name) => {
          bar.style.display = "block";
          const pct = size ? Math.floor((got * 100) / size) : 100;
          fill.style.width = pct + "%";
          setStatus("Receiving " + pct + "%");
          meta.textContent = basename(name) + " — " + got + " / " + size + " bytes";
        },
        onComplete: (name, bytes) => {
          finished = true;
          setStatus("Saved \u2713", "ok");
          log("Saved " + basename(name) + " (" + bytes.length + " bytes)", "ok");
          download(name, bytes);
          try { device.gatt.disconnect(); } catch (_) {}
          cleanup();
        },
        onError: (m) => { setStatus("Error: " + m, "err"); log(m, "err"); try { device.gatt.disconnect(); } catch (_) {} cleanup(); },
      });

      tx.addEventListener("characteristicvaluechanged", (e) => {
        const v = e.target.value;
        parser.push(new Uint8Array(v.buffer, v.byteOffset, v.byteLength));
      });
      await tx.startNotifications(); // triggers bonding on first connect

      const go = new TextEncoder().encode("GO\n");
      try { await rx.writeValueWithoutResponse(go); }
      catch (_) { await rx.writeValueWithResponse(go); }

      setStatus("Waiting for data…");
      log("Sent GO. Start 'Send over BLE' on the Flipper if you haven't.");

      setTimeout(() => {
        if (!finished) { setStatus("Timed out", "err"); log("No data within 120s.", "err"); try { device.gatt.disconnect(); } catch (_) {} cleanup(); }
      }, 120000);
    } catch (e) {
      setStatus("Connection failed", "err");
      log(String(e && e.message ? e.message : e), "err");
      cleanup();
    }
  }

  btn.addEventListener("click", receive);
</script>
</body>
</html>
